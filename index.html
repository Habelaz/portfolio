<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abel Zereabruk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      function updateFavicon() {
        const theme = document.documentElement.getAttribute('data-theme') || 'dark';
        const isDark = theme === 'dark';
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="${isDark ? '#12161d' : '#ffffff'}"/><text x="16" y="22" text-anchor="middle" font-family="Sora, sans-serif" font-size="16" font-weight="600" fill="${isDark ? '#7fb7a3' : '#4f8a72'}">AZ</text></svg>`;
        const blob = new Blob([svg], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        const link = document.querySelector("link[rel='icon']");
        if (link) link.href = url;
      }
      updateFavicon();
      new MutationObserver(updateFavicon).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    </script>
  </body>
</html>
